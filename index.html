<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<title>BAPS Meeting Tracker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mobile-first app: top bar + content + bottom tabs on phones; sidebar on desktop. Full-screen sheets for detail screens. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f6f7f9; --fg:#1a1f2b; --muted:#667085; --line:#e4e7ec; --line-2:#d0d5dd;
  --brand:#141c33; --brand-2:#26324f; --on-brand:#f2efe7; --on-brand-dim:rgba(242,239,231,.62); --gold:#d3b06c;
  --accent:#9a7432; --accent-ink:#7d5c22; --accent-soft:#f5efe3; --on-accent:#ffffff;
  --done:#2f7a52; --done-soft:#e6f2eb; --moved:#9a6b25; --moved-soft:#f6eedf; --cancel:#6f7686; --cancel-soft:#eef0f3; --alert:#b2443f; --alert-soft:#f9e9e8;
  --sched:#26324f; --sched-soft:#e8ebf3;
  --d-shayona:#2a78d6; --d-kitchen:#eb6834; --d-accounts:#1baf7a; --d-akshardham:#eda100; --d-capital:#e87ba4; --d-dharmada:#008300;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif; --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.05); --shadow-2:0 18px 50px rgba(16,24,40,.22);
  --r:16px; --tab-h:64px; --side:232px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e121b; --surface:#161b26; --surface-2:#1c2230; --fg:#eceef2; --muted:#98a2b3; --line:#262d3c; --line-2:#344054;
--brand:#0a0f1e; --brand-2:#1b2440; --on-brand:#f2efe7; --on-brand-dim:rgba(242,239,231,.6); --gold:#d3b06c;
--accent:#d3b06c; --accent-ink:#dfc28a; --accent-soft:#2a2416; --on-accent:#17130a;
--done:#7fbf9b; --done-soft:#1a2c23; --moved:#ddb06a; --moved-soft:#2f2717; --cancel:#a3aab8; --cancel-soft:#232a36; --alert:#ec8a84; --alert-soft:#3a1f1e;
--sched:#93a6d8; --sched-soft:#1f2740;
--d-shayona:#3987e5; --d-kitchen:#d95926; --d-accounts:#199e70; --d-akshardham:#c98500; --d-capital:#d55181; --d-dharmada:#2aa02a;
--shadow:none; --shadow-2:0 16px 44px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e121b; --surface:#161b26; --surface-2:#1c2230; --fg:#eceef2; --muted:#98a2b3; --line:#262d3c; --line-2:#344054;
--brand:#0a0f1e; --brand-2:#1b2440; --on-brand:#f2efe7; --on-brand-dim:rgba(242,239,231,.6); --gold:#d3b06c;
--accent:#d3b06c; --accent-ink:#dfc28a; --accent-soft:#2a2416; --on-accent:#17130a;
--done:#7fbf9b; --done-soft:#1a2c23; --moved:#ddb06a; --moved-soft:#2f2717; --cancel:#a3aab8; --cancel-soft:#232a36; --alert:#ec8a84; --alert-soft:#3a1f1e;
--sched:#93a6d8; --sched-soft:#1f2740;
--d-shayona:#3987e5; --d-kitchen:#d95926; --d-accounts:#199e70; --d-akshardham:#c98500; --d-capital:#d55181; --d-dharmada:#2aa02a;
--shadow:none; --shadow-2:0 16px 44px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{flex:none}
[data-dept="Shayona"]{--dc:var(--d-shayona)} [data-dept="Kitchen"]{--dc:var(--d-kitchen)} [data-dept="Accounts"]{--dc:var(--d-accounts)}
[data-dept="Capital Projects"]{--dc:var(--d-capital)} [data-dept="Dharmada"]{--dc:var(--d-dharmada)} [data-dept="Akshardham"]{--dc:var(--d-akshardham)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dc,var(--muted));flex:none}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;flex:1;min-width:0}
.top .sub{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.main{padding:4px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:860px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px))}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.side{display:none}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));z-index:25;height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;background:var(--brand);color:var(--on-brand);
  display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;box-shadow:0 8px 24px rgba(16,24,40,.28);cursor:pointer}
.fab svg{width:22px;height:22px;color:var(--gold)}
.iconbtn{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.iconbtn .pip{position:absolute}
@media (min-width:900px){
  .tabs,.fab{display:none}
  .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--brand);color:var(--on-brand);padding:22px 14px 18px;z-index:30;gap:4px}
  .side .brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px}
  .side .brand b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block;line-height:1.2}
  .side .brand small{font-size:12px;color:var(--on-brand-dim)}
  .side .mark{width:36px;height:36px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold);display:grid;place-items:center}
  .side .mark svg{width:20px;height:20px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:15px;color:var(--on-brand-dim);flex:none}
  .side .tab svg{width:20px;height:20px}
  .side .tab:hover{background:rgba(255,255,255,.06);color:var(--on-brand)}
  .side .tab[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--on-brand)}
  .side .tab[aria-current="page"] svg{color:var(--gold)}
  .side .badge{position:static;margin-left:auto}
  .side .addbtn{margin-top:14px;height:44px;border-radius:12px;border:0;background:var(--gold);color:#17130a;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .side .addbtn svg{width:18px;height:18px}
  .side .sync{margin-top:auto;font-size:12.5px;color:var(--on-brand-dim);display:flex;gap:8px;align-items:center;padding:0 6px}
  .top,.main{margin-left:var(--side)}
  .top{padding-top:22px}
  .top h1{font-size:28px}
  .main{padding-bottom:60px}
}
.sync i{width:8px;height:8px;border-radius:50%;background:#5fc68e;flex:none}
.sync.bad i{background:#ef7a72}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;color:var(--fg);text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary svg{color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--alert)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.sec-h h2{font-size:17px}
.sec-h span{font-size:13.5px;color:var(--muted)}
.sec-h .more{margin-left:auto;font-size:14px;font-weight:600;color:var(--accent-ink);background:none;border:0;cursor:pointer;padding:6px 0}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:2px}
.hint{font-size:13.5px;color:var(--muted);margin:8px 2px 0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;min-height:38px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.seg .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg .n.alert{color:var(--alert);font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;margin-top:12px}
.toolbar .seg{flex:1}
.pillbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);font-size:14.5px;font-weight:600;white-space:nowrap}
.pillbtn svg{width:18px;height:18px}
.pillbtn.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.pillbtn:focus-visible{outline:2px solid var(--accent)}
.search{position:relative;margin-top:6px}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px 0 44px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;background:hsl(var(--h) 42% 42%)}
.av.sm{width:22px;height:22px;font-size:9.5px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
.st svg{width:14px;height:14px}
.st.done{background:var(--done-soft);color:var(--done)} .st.resch{background:var(--moved-soft);color:var(--moved)} .st.cx{background:var(--cancel-soft);color:var(--cancel)} .st.need{background:var(--alert-soft);color:var(--alert)} .st.today{background:var(--accent-soft);color:var(--accent-ink)} .st.up{background:var(--sched-soft);color:var(--sched)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.tag.grey{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- meeting rows ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.day-h{font-size:14px;font-weight:700;margin:18px 4px 8px;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.day-h small{color:var(--muted);font-weight:500;font-size:13px}
.day-h.today{color:var(--accent-ink)}
.mrow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);position:relative}
.mrow:first-child{border-top:0}
.mrow::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--dc)}
.mrow:hover{background:var(--surface-2)}
.mrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mrow .tm{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.mrow .tm small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.mrow .mm{min-width:0}
.mrow .nm{font-size:15.5px;font-weight:600;line-height:1.3;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mrow .sb{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.cx .nm>span:first-child{text-decoration:line-through;color:var(--muted)}
.quick{display:flex;gap:6px;padding:0 14px 13px 90px;margin-top:-4px;flex-wrap:wrap}
.quick .btn{min-height:38px;font-size:14px;padding:0 12px;border-radius:10px;flex:1 1 auto}
.quick .btn.ok{color:var(--done);border-color:color-mix(in srgb,var(--done) 40%,var(--line-2))}
.quick .btn.mv{color:var(--moved);border-color:color-mix(in srgb,var(--moved) 40%,var(--line-2))}
.quick .btn.no{color:var(--cancel)}
.qwrap{border-top:1px solid var(--line)}
.qwrap:first-child{border-top:0}
.qwrap .mrow{border-top:0}
.showmore{all:unset;cursor:pointer;display:block;text-align:center;width:100%;padding:14px;font-weight:600;color:var(--accent-ink);font-size:15px}

/* ---------- home ---------- */
.hello{background:var(--brand);color:var(--on-brand);border-radius:20px;padding:20px 20px 18px;margin-top:4px;position:relative;overflow:hidden}
.hello::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 105% -10%,color-mix(in srgb,var(--gold) 15%,transparent) 0 1px,transparent 1.5px 24px)}
.hello>*{position:relative}
.hello .g{font-size:13.5px;color:var(--gold);font-weight:600}
.hello h2{font-size:24px;margin-top:4px;font-weight:500}
.hello p{margin:4px 0 0;font-size:14.5px;color:var(--on-brand-dim)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi.done b{color:var(--done)}.kpi.resch b{color:var(--moved)}.kpi.cx b{color:var(--cancel)}.kpi.need b{color:var(--alert)}
.kpi:focus-visible{outline:2px solid var(--accent)}
.alertcard{border-color:color-mix(in srgb,var(--alert) 35%,var(--line))}

/* ---------- actions ---------- */
.arow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px;align-items:center;padding:8px 14px 8px 6px;border-top:1px solid var(--line);cursor:pointer}
.arow:first-child{border-top:0}
.arow:hover{background:var(--surface-2)}
.arow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tick{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center}
.tick span{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;color:transparent}
.tick span svg{width:15px;height:15px}
.tick:hover span{box-shadow:inset 0 0 0 2px var(--done);color:var(--done)}
.tick[aria-pressed="true"] span{background:var(--done);color:#fff;box-shadow:none}
.tick:focus-visible{outline:2px solid var(--accent);border-radius:50%}
.arow .at{font-size:15.5px;font-weight:600;line-height:1.35}
.arow.done .at{text-decoration:line-through;color:var(--muted)}
.arow .as{font-size:13px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.arow .as .who{display:inline-flex;gap:5px;align-items:center;color:var(--fg);font-weight:600}
.arow .due{font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;text-align:right}
.arow .due.late{color:var(--alert);font-weight:700}.arow .due.soon{color:var(--moved);font-weight:700}
.hi{color:var(--alert);font-weight:700;font-size:12.5px}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;gap:6px;margin-top:6px}
.calhead h2{font-size:20px;flex:1}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin:12px 2px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%}
.legend b{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px}
.dow{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cell{all:unset;box-sizing:border-box;cursor:pointer;min-height:58px;border-radius:10px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cell:hover{background:var(--surface-2)}
.cell.out{visibility:hidden}
.cell .n{font-size:14.5px;font-weight:600;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--brand);color:var(--on-brand)}
.cell.sel{background:var(--accent-soft)}
.cell.sel .n{box-shadow:inset 0 0 0 2px var(--accent)}
.cell:focus-visible{outline:2px solid var(--accent)}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:44px}
.cell .dots i{width:7px;height:7px;border-radius:50%}
.cell .evs{display:none}
@media (min-width:700px){
  .cell{min-height:96px;align-items:stretch;padding:6px}
  .cell .n{width:26px;height:26px;font-size:13.5px}
  .cell .dots{display:none}
  .cell .evs{display:flex;flex-direction:column;gap:3px}
  .cell .ev{font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 14%,var(--surface));box-shadow:inset 3px 0 0 var(--c)}
  .cell .ev.cx{text-decoration:line-through;color:var(--muted)}
  .cell .more{font-size:11.5px;color:var(--muted);font-weight:600;padding-left:4px}
}
details.tally{margin-top:16px}
details.tally summary{cursor:pointer;list-style:none;padding:16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
details.tally summary::-webkit-details-marker{display:none}
details.tally summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.tally[open] summary::after{transform:rotate(-135deg)}
.ttable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ttable th,.ttable td{padding:9px 8px;border-top:1px solid var(--line);text-align:center}

function calLoc(m){const t=track(m);return t.mode==='Online'?(t.link||t.location||'Online'):(t.location||'');}
function gDates(m){const t=track(m),d=parse(eff(m));if(t.start){const hm=s=>s.replace(':','')+'00';return ymd(d)+'T'+hm(t.start)+'/'+ymd(d)+'T'+hm(endOf(t));}const e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return ymd(d)+'/'+ymd(e);}
function gLink(m){return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title(m))+'&dates='+gDates(m)+'&details='+encodeURIComponent(details(m))+'&location='+encodeURIComponent(calLoc(m))+'&ctz=Australia/Sydney';}
function oLink(m){const t=track(m),d=parse(eff(m)),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);const tm=!!t.start;return'https://outlook.office.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&allday='+(tm?'false':'true')+'&subject='+encodeURIComponent(title(m))+'&startdt='+(tm?iso(d)+'T'+t.start+':00':iso(d))+'&enddt='+(tm?iso(d)+'T'+endOf(t)+':00':iso(e))+'&location='+encodeURIComponent(calLoc(m))+'&body='+encodeURIComponent(details(m).replace(/\n/g,'<br>'));}
function minutes(m){const t=track(m),L=[];const by=s=>t.attendees.filter(a=>a.att===s).map(a=>a.name).join(', ')||'—';
  L.push(title(m).toUpperCase(),long(eff(m))+(t.start?'  ·  '+timeText(t):'')+'  ·  '+SL[t.status],'Where: '+(whereText(t)||'—')+(t.mode==='Online'&&t.link?'  ('+t.link+')':''),...(t.reason&&(t.status==='Postponed'||t.status==='Cancelled')?['Reason '+(t.status==='Cancelled'?'cancelled':'moved')+': '+t.reason]:[]),'','ATTENDANCE','Present: '+by('Present'),'Apologies: '+by('Apology'),'Absent: '+by('Absent'),'','AGENDA',t.agenda.trim()||'—','','NOTES',t.notes.trim()||'—','','ACTION ITEMS');
  if(!t.actions.length)L.push('—');t.actions.forEach((a,i)=>L.push(`${i+1}. ${a.text}  |  Owner: ${a.owner||'—'}  |  Due: ${a.due?short(a.due):'—'}  |  ${a.status}`));return L.join('\n');}
function copyMinutes(m){const txt=minutes(m);const fb=()=>{download(txt,fileSafe('Minutes_'+m.dept+'_'+m.level+'_'+eff(m))+'.txt','text/plain');toast('Minutes saved as a text file',true);};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Minutes copied. Paste them into an email',true),fb);}catch(e){fb();}}
function fileSafe(s){return s.replace(/[^A-Za-z0-9_-]+/g,'_');}
function download(content,name,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\r?\n/g,'\\n');}
function fold(l){const o=[];while(l.length>73){o.push(l.slice(0,73));l=' '+l.slice(73);}o.push(l);return o.join('\r\n');}
function dlIcs(items,name,cal){const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BAPS Australia//Meeting Tracker//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(cal),'X-WR-TIMEZONE:Australia/Sydney',
    'BEGIN:VTIMEZONE','TZID:Australia/Sydney','BEGIN:STANDARD','DTSTART:19700405T030000','RRULE:FREQ=YEARLY;BYMONTH=4;BYDAY=1SU','TZOFFSETFROM:+1100','TZOFFSETTO:+1000','TZNAME:AEST','END:STANDARD','BEGIN:DAYLIGHT','DTSTART:19701004T020000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=1SU','TZOFFSETFROM:+1000','TZOFFSETTO:+1100','TZNAME:AEDT','END:DAYLIGHT','END:VTIMEZONE'];
  items.forEach(m=>{const d=parse(eff(m)),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1),t=track(m);
    L.push('BEGIN:VEVENT','UID:'+m.id+'@meetings.au.baps.org','DTSTAMP:'+st,'SEQUENCE:'+Math.floor(Date.now()/60000%100000),...(t.start?['DTSTART;TZID=Australia/Sydney:'+ymd(d)+'T'+t.start.replace(':','')+'00','DTEND;TZID=Australia/Sydney:'+ymd(d)+'T'+endOf(t).replace(':','')+'00']:['DTSTART;VALUE=DATE:'+ymd(d),'DTEND;VALUE=DATE:'+ymd(e)]),'SUMMARY:'+icsEsc(title(m)),...(calLoc(m)?['LOCATION:'+icsEsc(calLoc(m))]:[]),...(/^https?:/i.test(t.link||'')?['URL:'+t.link]:[]),
      'DESCRIPTION:'+icsEsc('Department: '+m.dept+'\n'+details(m)),'CATEGORIES:'+icsEsc(m.dept),'STATUS:'+(t.status==='Cancelled'?'CANCELLED':'CONFIRMED'),'TRANSP:'+(t.start?'OPAQUE':'TRANSPARENT'),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title(m)+(t.start?' in 1 hour':' tomorrow')),'TRIGGER:'+(t.start?'-PT1H':'-PT15H'),'END:VALARM','END:VEVENT');});
  L.push('END:VCALENDAR');download(L.map(fold).join('\r\n')+'\r\n',name,'text/calendar');toast(items.length===1?'Calendar file downloaded':`Calendar file with ${items.length} meetings downloaded`,true);}
const cell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const csv=(rows,name,msg)=>{download('\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),name,'text/csv');toast(msg,true);};
const sorted=()=>M.slice().sort((a,b)=>a.date.localeCompare(b.date));
function dlRegister(){const rows=[['Scheduled Date','Meeting Date (after changes)','Start Time','End Time','Department','Seva Level','Frequency',"Swami's Presence required?",'Meeting Type','Location','Meeting Link','Status','Rescheduled To','Reason (cancelled / rescheduled)','Completed On','Needs update?','Agenda','Notes','Present','Apologies','Absent','Actions total','Actions open','Actions overdue']];
  sorted().forEach(m=>{const t=track(m),by=s=>t.attendees.filter(a=>a.att===s).map(a=>a.name).join('; ');
    rows.push([m.date,eff(m),t.start,t.end,m.dept,m.level,m.freq,m.swami,t.mode,t.location,t.link,SL[t.status],t.postponedTo,(t.status==='Postponed'||t.status==='Cancelled')?t.reason||'':'',t.completedOn,cat(m)==='need'?'Yes':'',t.agenda,t.notes,by('Present'),by('Apology'),by('Absent'),t.actions.length||'',t.actions.filter(a=>a.status!=='Done').length||'',t.actions.filter(overdue).length||'']);});
  csv(rows,'BAPS_Meeting_Register_'+TODAY_ISO+'.csv','Meeting register downloaded');}
function dlActions(){const rows=[['Meeting Date','Department','Seva Level','Action','Owner','Due Date','Status','Priority','% Complete','Overdue?','Done On','Added On','Latest Update','Latest Update By','Latest Update On']];
  sorted().forEach(m=>track(m).actions.forEach(a=>{const u=lastUpd(a);rows.push([eff(m),m.dept,m.level,a.text,a.owner,a.due,a.status==='Open'?'Not started':a.status,a.priority||'Medium',a.status==='Done'?100:(a.progress||0),overdue(a)?'Yes':'',a.doneOn||'',a.created||'',u?u.text:'',u?u.by:'',u?u.at.slice(0,10):'']);}));
  if(rows.length===1){toast('No action items recorded yet',true);return;}csv(rows,'BAPS_Action_Items_'+TODAY_ISO+'.csv','Action items downloaded');}
function dlAttend(){const rows=[['Meeting Date','Department','Seva Level','Name','Attendance']];sorted().forEach(m=>track(m).attendees.forEach(a=>rows.push([eff(m),m.dept,m.level,a.name,a.att])));
  if(rows.length===1){toast('No attendance recorded yet',true);return;}csv(rows,'BAPS_Attendance_'+TODAY_ISO+'.csv','Attendance downloaded');}
function dlTally(){const out=[['Month','Planned','Scheduled','Completed','Rescheduled','Cancelled','Not updated','Completion rate']];
  MONTHS.forEach(k=>{const ms=M.filter(m=>m.date.startsWith(k));const c={up:0,done:0,resch:0,cx:0,need:0};ms.forEach(m=>c[cat(m)]++);const due=c.done+c.resch+c.cx+c.need;
    out.push([fmt(parse(k+'-01'),{month:'long',year:'numeric'}),ms.length,c.up,c.done,c.resch,c.cx,c.need,due?Math.round(c.done/due*100)+'%':'']);});csv(out,'BAPS_Meeting_Tally_'+TODAY_ISO+'.csv','Tally downloaded');}
const imp=h('input',{type:'file',accept:'.json,application/json',hidden:true});document.body.append(imp);
imp.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result),recs=j.records||j;let n=0;
    for(const[k,v]of Object.entries(recs)){if(v&&STATUSES.includes(v.status)&&(BYID[k]||v.custom)){const cur=store[k];if(!cur||!cur.updated||(v.updated||'')>=cur.updated){const rec={...DEF(),...v,attendees:Array.isArray(v.attendees)?v.attendees:[],actions:Array.isArray(v.actions)?v.actions:[]};store[k]=rec;persist(k,rec);n++;}}}
    if(!CONFIGURED)persist();rebuildM();renderView();toast(n?`Restored ${plural(n,'meeting')}`:'Nothing new in that file',true);}catch(err){toast('Choose the .json file made by Export a backup',true);}imp.value='';};r.readAsText(f);});

/* ================= boot ================= */
$('#fab').addEventListener('click',()=>ui.view==='actions'?newActionSheet():newMeetingSheet());
$('#side-add').addEventListener('click',()=>ui.view==='actions'?newActionSheet():newMeetingSheet());
$('#scrim').addEventListener('click',()=>closeSheet());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&topSheet())closeSheet();});
function liveRefresh(){clearTimeout(liveRefresh._t);liveRefresh._t=setTimeout(()=>{const a=document.activeElement;const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  const s=topSheet();if(s&&!typing){if(s.refresh)s.refresh();paint(false);}if(!(typing&&!s&&a.id==='q'))renderView(true);},200);}
async function loadAll(){const all={};let from=0;for(;;){const r=await SB.from('meetings').select('id,data').range(from,from+999);if(r.error)throw r.error;r.data.forEach(x=>all[x.id]=x.data);if(r.data.length<1000)break;from+=1000;}return all;}
async function boot(){
  if(!CONFIGURED){rebuildM();renderView();setSync('local');return;}
  setSync('connecting');SB=window.supabase.createClient(SB_URL,SB_KEY);
  const connect=async()=>{try{store=await loadAll();rebuildM();LIVE=true;setSync('ok');renderView(true);if(!myName&&!sessionStorage.getItem('nm-asked')){try{sessionStorage.setItem('nm-asked','1');}catch(e){}nameSheet(false);}}
    catch(e){console.error(e);setSync('err');setTimeout(connect,5000);}};
  await connect();
  SB.channel('meetings-live').on('postgres_changes',{event:'*',schema:'public',table:'meetings'},p=>{if(p.eventType==='DELETE')delete store[p.old.id];else if(p.new&&p.new.id)store[p.new.id]=p.new.data;rebuildM();liveRefresh();})
    .subscribe(st=>{if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setSync('err');else if(st==='SUBSCRIBED'&&LIVE)setSync('ok');});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LIVE&&!pending)loadAll().then(s=>{store=s;rebuildM();liveRefresh();}).catch(()=>{});});
}
renderView();boot();

document.getElementById('mark').innerHTML=I.cal;
(function(){const sa=document.getElementById('side-add');const upd=()=>{sa.innerHTML=I.plus+(ui.view==='actions'?'Add action':'Add meeting');};const rv=renderNav;renderNav=function(){rv();upd();};upd();})();
</script>
