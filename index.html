<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BAPS Meeting Tracker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: maroon sidebar + main column (desktop); top bar + bottom tab bar (phone). Meeting details open in a right-hand drawer. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f7f8fa; --fg:#1a1f2b; --muted:#667085; --line:#e4e7ec; --line-2:#d0d5dd;
  --brand:#141c33; --brand-2:#26324f; --on-brand:#f2efe7; --on-brand-dim:rgba(242,239,231,.62);
  --saffron:#9a7432; --saffron-ink:#7d5c22; --saffron-soft:#f5efe3; --on-saffron:#ffffff; --gold-hi:#d3b06c;
  --done:#3d7a5a; --done-soft:#e8f2ec; --moved:#9a6b25; --moved-soft:#f6eedf; --cancel:#6f7686; --cancel-soft:#eef0f3; --alert:#b2443f; --alert-soft:#f9e9e8;
  --sched:#cfd5df; --c-held:#26324f; --c-up:#c8d0de; --c-cx:#8b93a3;
  --d-shayona:#2a78d6; --d-kitchen:#eb6834; --d-accounts:#1baf7a; --d-akshardham:#eda100; --d-capital:#e87ba4; --d-dharmada:#008300;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.04);
  --shadow-2:0 16px 44px rgba(16,24,40,.18);
  --side:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e121b; --surface:#161b26; --surface-2:#1c2230; --fg:#eceef2; --muted:#98a2b3; --line:#262d3c; --line-2:#344054;
  --brand:#0a0f1e; --brand-2:#1b2440; --on-brand:#f2efe7; --on-brand-dim:rgba(242,239,231,.6);
  --saffron:#d3b06c; --saffron-ink:#dfc28a; --saffron-soft:#2a2416; --on-saffron:#17130a; --gold-hi:#d3b06c;
  --done:#7fbf9b; --done-soft:#1a2c23; --moved:#ddb06a; --moved-soft:#2f2717; --cancel:#a3aab8; --cancel-soft:#232a36; --alert:#ec8a84; --alert-soft:#3a1f1e;
  --sched:#3a4358; --c-held:#93a6d8; --c-up:#3a4358; --c-cx:#6b7488;
  --d-shayona:#3987e5; --d-kitchen:#d95926; --d-accounts:#199e70; --d-akshardham:#c98500; --d-capital:#d55181; --d-dharmada:#008300;
  --shadow-1:none; --shadow-2:0 16px 44px rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e121b; --surface:#161b26; --surface-2:#1c2230; --fg:#eceef2; --muted:#98a2b3; --line:#262d3c; --line-2:#344054;
  --brand:#0a0f1e; --brand-2:#1b2440; --on-brand:#f2efe7; --on-brand-dim:rgba(242,239,231,.6);
  --saffron:#d3b06c; --saffron-ink:#dfc28a; --saffron-soft:#2a2416; --on-saffron:#17130a; --gold-hi:#d3b06c;
  --done:#7fbf9b; --done-soft:#1a2c23; --moved:#ddb06a; --moved-soft:#2f2717; --cancel:#a3aab8; --cancel-soft:#232a36; --alert:#ec8a84; --alert-soft:#3a1f1e;
  --sched:#3a4358; --c-held:#93a6d8; --c-up:#3a4358; --c-cx:#6b7488;
  --d-shayona:#3987e5; --d-kitchen:#d95926; --d-accounts:#199e70; --d-akshardham:#c98500; --d-capital:#d55181; --d-dharmada:#008300;
  --shadow-1:none; --shadow-2:0 16px 44px rgba(0,0,0,.55); color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
[hidden]{display:none!important}
svg{flex:none}
[data-dept="Shayona"]{--dc:var(--d-shayona)} [data-dept="Kitchen"]{--dc:var(--d-kitchen)} [data-dept="Accounts"]{--dc:var(--d-accounts)}
[data-dept="Capital Projects"]{--dc:var(--d-capital)} [data-dept="Dharmada"]{--dc:var(--d-dharmada)} [data-dept="Akshardham"]{--dc:var(--d-akshardham)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dc,var(--muted));flex:none}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:30}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}
.mark{width:38px;height:38px;border-radius:11px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--gold-hi);color:var(--gold-hi);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:16px;font-weight:600;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--on-brand-dim)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--on-brand-dim)}
.nav button svg{width:19px;height:19px}
.nav button:hover{background:rgba(255,255,255,.07);color:var(--on-brand)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--on-brand)}
.nav button[aria-current="page"] svg{color:var(--gold-hi)}
.nav button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--gold-hi)}
.nav button:focus-visible{outline:2px solid var(--saffron)}
.nav .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold-hi);color:#17130a;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.alert{background:var(--alert);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--on-brand);border:1px solid rgba(255,255,255,.16)}
.side-btn:hover{background:rgba(255,255,255,.07)}
.side-btn.primary{background:var(--gold-hi);color:#17130a;border-color:transparent}
.side-btn.primary:hover{filter:brightness(1.05)}
.side-btn svg{width:17px;height:17px}
.side-btn:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.saved{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--on-brand-dim);padding:6px 4px 0}
.saved i{width:7px;height:7px;border-radius:50%;background:#7fd6a2}
.saved.bad i{background:#ff8f86}

.main{margin-left:var(--side);min-height:100vh;padding-block:22px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
.topbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topbar .ttl{flex:1 1 260px;min-width:0}
.topbar h1{font-size:26px}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:14px}
.search{position:relative;flex:0 1 320px;min-width:0}
.search input{width:100%;height:42px;padding:0 14px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.mob-actions{display:none;gap:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-1)}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.select{height:34px;border-radius:17px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-1)}
.filters .select{margin-left:auto}

.tabbar{display:none}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn svg{width:16px;height:16px}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:var(--on-saffron)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.danger:hover{background:var(--alert-soft);color:var(--alert)}
.icon-btn svg{width:17px;height:17px}
.icon-btn:focus-visible{outline:2px solid var(--saffron)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1)}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px}
.p-Scheduled{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-Completed{background:var(--done-soft);color:var(--done)}
.p-Postponed{background:var(--moved-soft);color:var(--moved)}
.p-Cancelled{background:var(--cancel-soft);color:var(--cancel)}
.p-need{background:var(--alert-soft);color:var(--alert)}
.p-today{background:var(--saffron-soft);color:var(--saffron-ink)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;background:hsl(var(--h) 45% 42%)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;font-weight:600;margin-bottom:4px}
.empty svg{width:40px;height:40px;color:var(--line-2);margin-bottom:8px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.seg button:focus-visible{outline:2px solid var(--saffron)}
.seg .n{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seg .n.alert{color:var(--alert)}

/* ---------- dashboard ---------- */
.hero{margin-top:22px;border-radius:22px;background:var(--brand);color:var(--on-brand);padding:28px 30px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 104% -10%,color-mix(in srgb,var(--gold-hi) 16%,transparent) 0 1px,transparent 1.5px 26px),radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--gold-hi) 22%,transparent),transparent 60%)}
.hero>*{position:relative}
.hero .hi{font-size:14px;color:var(--on-brand-dim);font-weight:600}
.hero h2{font-size:clamp(26px,3.2vw,36px);line-height:1.15;margin-top:6px;font-weight:500;letter-spacing:-.02em}
.hero .hi{color:var(--gold-hi)!important;letter-spacing:.02em}
.hero .when{margin-top:8px;color:var(--on-brand-dim);font-size:14.5px}
.hero .warn{all:unset;cursor:pointer;margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600}
.hero .warn:hover{background:rgba(255,255,255,.18)}
.hero .warn i{width:8px;height:8px;border-radius:50%;background:#ff9b8f}
.hero .warn:focus-visible{outline:2px solid var(--saffron)}
.next{display:flex;flex-direction:column;gap:8px}
.next .lbl{font-size:13px;font-weight:600;color:var(--on-brand-dim)}
.nx{all:unset;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px 10px 10px}
.nx:hover{background:rgba(255,255,255,.13)}
.nx:focus-visible{outline:2px solid var(--saffron)}
.nx .d{background:var(--surface);color:var(--fg);border-radius:10px;text-align:center;padding:5px 0;line-height:1.05;border-top:4px solid var(--dc)}
.nx .d small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.nx .d b{font-family:var(--f-display);font-size:19px;font-weight:600}
.nx .t{min-width:0}
.nx .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx .t span{font-size:12.5px;color:var(--on-brand-dim)}
.nx .tg{font-size:11.5px;font-weight:700;background:var(--gold-hi);color:#17130a;padding:3px 8px;border-radius:7px;white-space:nowrap}
.nx .tg.soft{background:rgba(255,255,255,.14);color:var(--on-brand)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:42px 1fr;gap:4px 12px;align-items:center;box-shadow:var(--shadow-1)}
.stat:hover{border-color:var(--line-2)}
.stat:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.stat .ic{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--ink)}
.stat .ic svg{width:21px;height:21px}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:500}
.s-month{--tint:var(--saffron-soft);--ink:var(--saffron-ink)} .s-done{--tint:var(--done-soft);--ink:var(--done)} .s-need{--tint:var(--alert-soft);--ink:var(--alert)} .s-act{--tint:var(--moved-soft);--ink:var(--moved)}

.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:14px;min-width:0}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:17px}
.card-h p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px}
.mc{position:relative;height:calc(var(--H) + 46px);padding-left:28px}
.mc-grid{position:absolute;left:28px;right:0;top:22px;height:var(--H)}
.mc-grid .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.7}
.mc-grid .gl:first-child{border-top-style:solid}
.mc-grid .gl span{position:absolute;left:-28px;top:-9px;width:20px;text-align:right;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mc-bars{position:absolute;left:28px;right:0;top:0;height:calc(var(--H) + 22px);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end}
.mc-col{all:unset;box-sizing:border-box;cursor:pointer;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:10px;position:relative}
.mc-col:hover,.mc-col:focus-visible{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.mc-col:focus-visible{outline:2px solid var(--saffron)}
.mc-stack{width:min(62%,38px);display:flex;flex-direction:column-reverse;gap:2px}
.mc-stack i{display:block;min-height:3px}
.mc-stack i:last-child{border-radius:6px 6px 0 0}
.mc-col.now{background:color-mix(in srgb,var(--saffron) 8%,transparent)}
.mc-col.now .mc-val{color:var(--saffron-ink)}
.mc-val{font-size:13px;font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums}
.mc-lab{position:absolute;bottom:-24px;font-size:12px;color:var(--muted);font-weight:600}
.mc-col.now .mc-lab{color:var(--saffron-ink)}
.mc-col.now .mc-lab::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--saffron);margin:2px auto 0}
.tip{position:fixed;z-index:80;background:var(--surface);color:var(--fg);border:1px solid var(--line-2);border-radius:11px;padding:9px 12px;font-size:12.5px;line-height:1.65;box-shadow:var(--shadow-2);pointer-events:none;max-width:260px}
.tip .tk{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:7px}
.tip .tk[data-dept]{background:var(--dc);border-radius:50%}
.tip hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.hbars{display:flex;flex-direction:column;gap:4px}
.hb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:150px minmax(0,1fr) 340px;gap:16px;align-items:center;padding:9px 10px;border-radius:12px}
.hb:hover{background:var(--surface-2)}
.hb:focus-visible{outline:2px solid var(--saffron)}
.hb-name{display:inline-flex;gap:9px;align-items:center;font-weight:600;font-size:14px;white-space:nowrap}
.hb-track{display:flex;align-items:center;gap:10px;min-width:0}
.hb-fill{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;min-width:6px}
.hb-fill i{display:block;height:100%}
.hb-n{font-size:14px;font-variant-numeric:tabular-nums}
.hb-meta{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.hb-meta .late{color:var(--alert);font-weight:700}
@media (max-width:900px){.hb{grid-template-columns:1fr;gap:6px}}
details.tbl summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);width:max-content}
details.tbl[open] summary{margin-bottom:10px}
.dtable{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dtable th:first-child{text-align:left}
.dtable thead th{font-size:12px;color:var(--muted);font-weight:600}
.dtable tfoot td,.dtable tfoot th,.dtable .tot{font-weight:700}

.depts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dept{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;background:var(--surface)}
.dept::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--dc)}
.dept:hover{border-color:var(--line-2);background:var(--surface-2)}
.dept:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.dept .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dept .top b{font-size:15px;font-weight:700}
.dept .top span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:7px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.dept .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
.dept .meta .late{color:var(--alert);font-weight:700}

.alist-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alist-mini li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.alist-mini li:first-child{border-top:0}
.alist-mini .tx{flex:1;min-width:0}
.alist-mini .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alist-mini .tx small{font-size:12.5px;color:var(--muted)}
.duechip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.duechip.late{background:var(--alert-soft);color:var(--alert);box-shadow:none}
.duechip.soon{background:var(--moved-soft);color:var(--moved);box-shadow:none}
.mini-stats{display:flex;gap:10px 26px;flex-wrap:wrap}
.mini-stats div{display:flex;flex-direction:column}
.mini-stats b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.mini-stats span{font-size:12.5px;color:var(--muted)}
.ppl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ppl li{display:grid;grid-template-columns:30px minmax(0,120px) 1fr 42px;gap:10px;align-items:center;font-size:13.5px}
.ppl .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppl .pb{display:flex;gap:2px;height:8px}
.ppl .pb i{display:block;height:100%;border-radius:3px}
.ppl .pc{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.uns{display:flex;flex-wrap:wrap;gap:8px}
.uns span{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:6px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.uns span small{color:var(--muted)}

/* ---------- meetings list ---------- */
.list-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.banner{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--alert-soft);border-radius:14px;padding:12px 16px}
.banner svg{width:20px;height:20px;color:var(--alert)}
.banner p{margin:0;flex:1 1 260px;font-size:14px}
.month{margin-top:26px}
.month-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-left:4px}
.month-h h2{font-size:18px}
.month-h span{font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-1)}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto 40px;gap:16px;align-items:center;padding:12px 16px 12px 14px;cursor:pointer;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--saffron);outline-offset:-2px}
.row.sel{background:var(--saffron-soft)}
.dbox{width:52px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:center;padding:5px 0 6px;line-height:1.05;overflow:hidden;position:relative}
.dbox::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--dc)}
.dbox small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.dbox b{font-family:var(--f-display);font-size:20px;font-weight:600}
.row.is-today .dbox{background:var(--brand);box-shadow:none}
.row.is-today .dbox small{color:var(--gold-hi)}.row.is-today .dbox b{color:var(--on-brand)}
.r-main{min-width:0}
.r-main .t{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.r-main .s{font-size:13px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:1px}
.r-main .s .dp{display:inline-flex;gap:6px;align-items:center;color:var(--fg);font-weight:600}
.tent{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);padding:2px 8px;border-radius:6px}
.swami{font-size:11.5px;font-weight:700;color:var(--saffron-ink);background:var(--saffron-soft);padding:2px 8px;border-radius:6px}
.row.is-cancel .t{text-decoration:line-through;color:var(--muted)}
.rec{display:flex;gap:12px;color:var(--muted)}
.rec span{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.35}
.rec span.on{opacity:1;color:var(--fg)}
.rec span.late{opacity:1;color:var(--alert)}
.rec svg{width:15px;height:15px}
.tick{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line-2);color:transparent}
.tick:hover{box-shadow:inset 0 0 0 2px var(--done);color:var(--done)}
.tick[aria-pressed="true"]{background:var(--done);box-shadow:none;color:#fff}
.tick svg{width:18px;height:18px}
.tick:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* ---------- calendar ---------- */
.cal{margin-top:22px;padding:18px}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cal-nav h2{font-size:20px;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:12px;font-weight:700;color:var(--muted);padding:0 8px 4px}
.cell{all:unset;box-sizing:border-box;cursor:pointer;min-height:104px;border-radius:12px;background:var(--surface-2);padding:7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.cell.out{background:transparent;cursor:default;opacity:.35}
.cell.today .n{background:var(--brand);color:var(--on-brand);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cell.sel{box-shadow:inset 0 0 0 2px var(--fg)}
.cell:focus-visible{outline:2px solid var(--saffron)}
.cell .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;height:24px;display:flex;align-items:center;padding-left:3px}
.ev{font-size:11.5px;line-height:1.3;padding:3px 6px;border-radius:6px;background:var(--surface);color:var(--fg);box-shadow:inset 3px 0 0 var(--dc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.s-Completed{opacity:.55}.ev.s-Cancelled{text-decoration:line-through;opacity:.45}
.ev.need{box-shadow:inset 3px 0 0 var(--dc),inset 0 0 0 1px var(--alert)}
.more{font-size:11.5px;color:var(--muted);padding-left:4px;font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.day-h{margin:24px 0 10px 4px;font-size:17px}

/* ---------- actions board ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;align-items:center;gap:9px;padding:4px 6px}
.col-h h3{font-size:15px}
.col-h i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.col-h span{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-1);position:relative}
.acard.late{border-color:color-mix(in srgb,var(--alert) 45%,var(--line))}
.acard .tx{font-weight:600;font-size:14.5px;line-height:1.4}
.acard.done .tx{text-decoration:line-through;color:var(--muted)}
.acard .mt{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.acard .mt:hover{color:var(--fg);text-decoration:underline}
.acard .mt:focus-visible{outline:2px solid var(--saffron)}
.acard .ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acard .ow{display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:600;margin-right:auto;min-width:0}
.acard .ow .av{width:24px;height:24px;font-size:10px}
.mv{display:flex;gap:6px}
.col-empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 8px;border:1.5px dashed var(--line-2);border-radius:12px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,8,14,.42);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:61;box-shadow:var(--shadow-2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none}
.dr-head{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 0 22px;position:relative}
.dr-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dc)}
.dr-top{display:flex;gap:12px;align-items:flex-start}
.dr-top .x{margin-left:auto;margin-top:-4px}
.dr-dept{display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.dr-head h2{font-size:23px;margin-top:3px}
.dr-when{font-size:14px;color:var(--muted);margin-top:4px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.st-btn{all:unset;cursor:pointer;height:34px;padding:0 13px;border-radius:10px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface)}
.st-btn svg{width:15px;height:15px}
.st-btn:hover{box-shadow:inset 0 0 0 1px var(--fg)}
.st-btn:focus-visible{outline:2px solid var(--saffron)}
.st-btn[aria-pressed="true"][data-s="Scheduled"]{background:var(--fg);color:var(--bg);box-shadow:none}
.st-btn[aria-pressed="true"][data-s="Completed"]{background:var(--done);color:#fff;box-shadow:none}
.st-btn[aria-pressed="true"][data-s="Postponed"]{background:var(--moved);color:#fff;box-shadow:none}
.st-btn[aria-pressed="true"][data-s="Cancelled"]{background:var(--cancel);color:#fff;box-shadow:none}
.where{display:inline-flex;gap:5px;align-items:center}
.where svg{width:14px;height:14px}
.where-box{margin-top:14px;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.where-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.where-row .inp{flex:1 1 220px;height:36px}
.where-lab{font-size:13.5px;font-weight:700;margin-right:4px;width:46px}
.where-row input[type=time]{height:36px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:0 10px}
.where-row input[type=time]:disabled{opacity:.5}
.muted-to{color:var(--muted);font-size:13.5px}
.where-box .btn.ghost{align-self:flex-start;padding:0 6px;color:var(--saffron-ink)}
.tri.wide button{display:inline-flex;gap:6px;align-items:center;height:30px;padding:0 12px}
.tri.wide button svg{width:15px;height:15px}
.tri button[aria-pressed="true"][data-m]{}
.where-box .tri button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.st-extra{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13.5px;flex-wrap:wrap}
.st-extra label{font-weight:600}
input[type=date],.inp{height:38px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:0 11px;min-width:0}
.inp::placeholder,textarea::placeholder{color:var(--muted)}
.dr-tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
.dr-tabs button{all:unset;cursor:pointer;padding:10px 12px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.dr-tabs button:hover{color:var(--fg)}
.dr-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--saffron)}
.dr-tabs button:focus-visible{outline:2px solid var(--saffron);outline-offset:-2px}
.dr-tabs .n{font-size:11.5px;font-weight:700;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);padding:1px 7px;border-radius:9px}
.dr-tabs .n.late{background:var(--alert-soft);color:var(--alert);box-shadow:none}
.dr-body{flex:1;overflow-y:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:18px}
.dr-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dr-foot .sp{flex:1}
.dr-foot .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.fld{display:flex;flex-direction:column;gap:7px}
.fld>label{font-size:14px;font-weight:700}
.fld>label small{font-weight:500;color:var(--muted);margin-left:6px}
.fld textarea{border:1px solid var(--line-2);border-radius:12px;background:var(--surface);padding:12px 14px;min-height:150px;resize:vertical;line-height:1.55;width:100%}
.addbar{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.addbar .inp{flex:1 1 200px;border-color:var(--line)}
.addbar .inp.ow{flex:0 1 160px}
.addbar input[type=date]{flex:0 1 150px;border-color:var(--line)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.att-list,.act-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.att-list li{display:flex;align-items:center;gap:12px;padding:9px 10px 9px 12px;border-top:1px solid var(--line)}
.att-list li:first-child{border-top:0}
.att-list .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-list li.Apology .nm,.att-list li.Absent .nm{color:var(--muted)}
.tri{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
.tri button{all:unset;cursor:pointer;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tri button:focus-visible{outline:2px solid var(--saffron)}
.tri button[aria-pressed="true"][data-s="Present"]{background:var(--done);color:#fff}
.tri button[aria-pressed="true"][data-s="Apology"]{background:var(--moved);color:#fff}
.tri button[aria-pressed="true"][data-s="Absent"]{background:var(--alert);color:#fff}
.tri button[aria-pressed="true"][data-s="Open"]{background:var(--fg);color:var(--bg)}
.tri button[aria-pressed="true"][data-s="In progress"]{background:var(--moved);color:#fff}
.tri button[aria-pressed="true"][data-s="Done"]{background:var(--done);color:#fff}
.act-list li{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:4px 10px;padding:12px 10px 12px 12px;border-top:1px solid var(--line);align-items:start}
.act-list li:first-child{border-top:0}
.act-list .chk{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;color:transparent;margin-top:4px}
.act-list .chk:hover{box-shadow:inset 0 0 0 2px var(--done);color:var(--done)}
.act-list .chk[aria-pressed="true"]{background:var(--done);color:#fff;box-shadow:none}
.act-list .chk svg{width:15px;height:15px}
.act-list .chk:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.act-list .tx{border:1px solid transparent;border-radius:8px;padding:5px 8px;width:100%;font-weight:600;background:transparent;margin-left:-8px}
.act-list .tx:hover{border-color:var(--line)}
.act-list .tx:focus{border-color:var(--line-2);background:var(--surface)}
.act-list li.done .tx{text-decoration:line-through;color:var(--muted)}
.act-list .sub{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act-list .sub .inp{height:32px;flex:0 1 150px;font-size:13px;border-color:var(--line)}
.act-list .sub input[type=date]{height:32px;font-size:13px;border-color:var(--line)}
.act-list li.late input[type=date]{border-color:var(--alert);color:var(--alert)}

/* ---------- popover & toast ---------- */
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-2);padding:6px;width:290px;display:flex;flex-direction:column}
.pop button{all:unset;cursor:pointer;padding:9px 11px;border-radius:9px;display:grid;grid-template-columns:22px 1fr;gap:2px 10px;align-items:center;font-size:14px;font-weight:600}
.pop button svg{width:18px;height:18px;color:var(--muted);grid-row:span 2}
.pop button small{font-size:12.5px;color:var(--muted);font-weight:500}
.pop button:hover,.pop button:focus-visible{background:var(--surface-2)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.dr-save{background:var(--surface);border-top:1px solid var(--line);padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dr-save .sp{flex:1}
.sv-state{font-size:13px;color:var(--muted);font-weight:600}
.sv-state.dirty{color:var(--moved)}
.sv-state.dirty::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--moved);margin-right:7px}
.sv-remote{font-size:12.5px;color:var(--alert);flex-basis:100%;order:3}
.dr-save.confirm{background:var(--moved-soft)}
.dr-save.confirm .sv-msg{font-weight:700;margin-right:auto}
.dr-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:14px;border-top:1px solid var(--line);margin-top:auto}
.dr-links .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.dr-links .sp{flex:1}
.danger-t{color:var(--alert)}
.nw-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center}
.nw-lab{font-size:14px;font-weight:700}
.nw-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.nw-in .inp,.nw-in select.inp{flex:1 1 200px;height:38px}
.nw-in input[type=date]{height:38px}
.add-btn{height:42px;border-radius:12px}
@media (max-width:560px){.nw-row{grid-template-columns:1fr;gap:6px}.add-btn span{display:none}.add-btn{width:42px;padding:0}}
.dr-acts{margin-left:auto;display:flex;gap:6px;align-items:flex-start;margin-top:-4px}
.dr-top .x{margin:0}
.btn.on{background:var(--surface-2);border-color:var(--fg)}
.ei-box{margin-top:14px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.ei-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center}
.ei-row label{font-size:13.5px;font-weight:700}
.ei-row .inp{height:36px;width:100%}
.ei-scope{display:flex;flex-direction:column;gap:6px;font-size:13.5px;padding-top:4px}
.ei-scope label{display:flex;gap:8px;align-items:center;cursor:pointer}
@media (max-width:560px){.ei-row{grid-template-columns:1fr;gap:4px}}
.dr-note{margin-top:12px;font-size:13px;background:var(--moved-soft);color:var(--fg);border-radius:10px;padding:8px 12px}
.side-btn.add{background:var(--on-brand);color:var(--brand);border-color:transparent}
.side-btn.add:hover{filter:brightness(.96)}
.dr-upd{font-size:12.5px;color:var(--muted);padding-top:2px}
.side-btn.who{border-style:dashed;font-weight:500;font-size:13px}
.side-btn.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .ph{font-size:12px;color:var(--muted);font-weight:700;padding:6px 11px 2px}

    rows.push([m.date,eff(m),t.start,t.end,m.dept,m.level,m.freq,m.swami,t.mode,t.location,t.link,SL[t.status],t.postponedTo,t.completedOn,derived(m)==='need'?'Yes':'',t.agenda,t.notes,by('Present'),by('Apology'),by('Absent'),t.actions.length||'',t.actions.filter(a=>a.status!=='Done').length||'',t.actions.filter(overdue).length||'']);});
  csv(rows,'BAPS_Meeting_Register_'+TODAY_ISO+'.csv','Meeting register downloaded');}
function dlActions(){const rows=[['Meeting Date','Department','Seva Level','Action','Owner','Due Date','Progress','Overdue?','Done On','Added On']];
  sorted().forEach(m=>track(m).actions.forEach(a=>rows.push([eff(m),m.dept,m.level,a.text,a.owner,a.due,a.status,overdue(a)?'Yes':'',a.doneOn||'',a.created||''])));
  if(rows.length===1){toast('No action items recorded yet');return;}csv(rows,'BAPS_Action_Items_'+TODAY_ISO+'.csv','Action items downloaded');}
function dlAttend(){const rows=[['Meeting Date','Department','Seva Level','Name','Attendance']];sorted().forEach(m=>track(m).attendees.forEach(a=>rows.push([eff(m),m.dept,m.level,a.name,a.att])));
  if(rows.length===1){toast('No attendance recorded yet');return;}csv(rows,'BAPS_Attendance_'+TODAY_ISO+'.csv','Attendance downloaded');}

/* ---------- popover menus ---------- */
const POPS={
  dl:()=>[h('div',{class:'ph',text:'Calendar files'}),
    item('ics','All meetings','Import the whole year into your calendar',()=>dlIcs(M.filter(m=>track(m).status!=='Cancelled'),'BAPS_Meetings_Oct2026-Sep2027.ics','BAPS Meetings')),
    item('ics',ui.dept?`${ui.dept} meetings`:'Meetings matching filters','Only what your current filters show',()=>{const x=base().filter(m=>track(m).status!=='Cancelled');if(!x.length){toast('No meetings match the filters');return;}dlIcs(x,'BAPS_Meetings_'+fileSafe(ui.dept||'Filtered')+'.ics','BAPS Meetings'+(ui.dept?' – '+ui.dept:''));}),
    h('hr'),h('div',{class:'ph',text:'Excel reports'}),
    item('sheet','Meeting register','Status, agenda, notes and attendance',dlRegister),item('sheet','Action items','Owner, due date and progress',dlActions),item('sheet','Attendance','One row per person per meeting',dlAttend)],
  bk:()=>[item('down','Export progress','Save everything you have entered to a file',()=>{download(JSON.stringify({app:'baps-meeting-tracker',version:3,exported:new Date().toISOString(),records:store},null,2),'BAPS_Meeting_Progress_'+TODAY_ISO+'.json','application/json');toast('Progress exported');}),
    item('up','Import progress','Load a file you exported earlier',()=>imp.click())]};
function item(i,l,s,fn){return h('button',{type:'button',role:'menuitem',onclick:()=>{closePop();fn();}},ic(i),h('span',{text:l}),h('small',{text:s}));}
function openPop(kind,btn){const p=document.getElementById('pop');if(!p.hidden&&p.dataset.kind===kind){closePop();return;}p.dataset.kind=kind;p.replaceChildren(...POPS[kind]());p.hidden=false;
  const r=btn.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;let x=r.left,y=r.bottom+6;
  if(r.left<240&&innerWidth>900){x=r.right+8;y=Math.min(r.top,innerHeight-ph-12);}
  x=Math.max(8,Math.min(x,innerWidth-pw-8));if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-6);p.style.left=x+'px';p.style.top=y+'px';p.querySelector('button')?.focus();}
function closePop(){document.getElementById('pop').hidden=true;}
const imp=h('input',{type:'file',accept:'.json,application/json',hidden:true});document.body.append(imp);
imp.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result),recs=j.records||j;let n=0;
    for(const[k,v]of Object.entries(recs)){if(BYID[k]&&v&&STATUSES.includes(v.status)){const cur=store[k];if(!cur||!cur.updated||(v.updated||'')>=cur.updated){const rec={...DEF(),...v,attendees:Array.isArray(v.attendees)?v.attendees:[],actions:Array.isArray(v.actions)?v.actions:[]};store[k]=rec;persist(k,rec);n++;}}}
    if(!CONFIGURED)persist();render();toast(n?`Imported ${plural(n,'meeting')}`:'Nothing new in that file');}catch(err){toast('Choose the .json file made by Export progress');}imp.value='';};r.readAsText(f);});

/* ---------- render ---------- */
const VIEW_FN={dash:renderDash,list:renderList,month:renderMonth,actions:renderActions};
function render(){renderShell();refreshPeople();hideTip();const v=document.getElementById('view');v.replaceChildren();VIEW_FN[ui.view](v);markSel();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pop]');if(b){e.stopPropagation();openPop(b.dataset.pop,b);return;}if(!e.target.closest('#pop'))closePop();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('pop').hidden)closePop();else if(ui.drawer)requestClose();hideTip();}});
document.getElementById('scrim').addEventListener('click',requestClose);
let qt;document.getElementById('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{ui.q=e.target.value.trim();if(ui.q&&ui.view==='dash')ui.view='list',ui.lst='all';render();},180);});
addEventListener('scroll',()=>{hideTip();},{passive:true});
addEventListener('resize',()=>{closePop();hideTip();});
function liveRefresh(){clearTimeout(liveRefresh._t);liveRefresh._t=setTimeout(()=>{
  if(D&&!D.isNew&&BYID[D.id]){const now=(store[D.id]||{}).updated||'';if(now!==D.base){D.base=now;if(D.dirty){D.remote=true;const a=document.activeElement;const typing=a&&document.getElementById('drawer').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(!typing)renderDrawer();}else{D.draft=clone(track(BYID[D.id]));const a=document.activeElement;const typing=a&&document.getElementById('drawer').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(!typing)renderDrawer();}}}
  softRefresh();},150);}
async function loadAll(){const all={};let from=0;
  for(;;){const r=await SB.from('meetings').select('id,data').range(from,from+999);if(r.error)throw r.error;r.data.forEach(x=>all[x.id]=x.data);if(r.data.length<1000)break;from+=1000;}
  return all;}
async function boot(){
  const who=document.getElementById('who');if(myName)document.getElementById('who-name').textContent='Editing as '+myName;
  who.addEventListener('click',()=>{askName();if(ui.drawer)renderDrawer();});
  if(!CONFIGURED){who.hidden=true;rebuildM();render();setSync('local');return;}
  setSync('connecting');
  SB=window.supabase.createClient(SB_URL,SB_KEY);
  const connect=async()=>{try{store=await loadAll();rebuildM();LIVE=true;setSync(pending?'saving':'live');render();if(ui.drawer)renderDrawer();}catch(e){console.error(e);setSync('err');toast('Could not reach the shared data. Check your connection; retrying…',true);setTimeout(connect,5000);}};
  await connect();
  SB.channel('meetings-live').on('postgres_changes',{event:'*',schema:'public',table:'meetings'},p=>{
    if(p.eventType==='DELETE'){delete store[p.old.id];}else if(p.new&&p.new.id){store[p.new.id]=p.new.data;}rebuildM();liveRefresh();})
    .subscribe(s=>{if(s==='CHANNEL_ERROR'||s==='TIMED_OUT')setSync('err');else if(s==='SUBSCRIBED'&&LIVE)setSync(pending?'saving':'live');});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LIVE&&!pending)loadAll().then(s=>{store=s;rebuildM();liveRefresh();}).catch(()=>{});});
}
document.getElementById('add-mtg').addEventListener('click',openNew);document.getElementById('add-mtg-side').addEventListener('click',openNew);
render();boot();
</script>
